name: Build Check (fix branches vs upstream)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/ratgdo/homekit-ratgdo32.git
  # Bump this whenever a workflow change should force a rebuild even though
  # the branch/upstream SHAs haven't changed (the cache keys don't otherwise
  # know the pipeline itself changed).
  CACHE_EPOCH: "5"

jobs:
  build-check:
    if: github.repository == 'bmusat/homekit-ratgdo32'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [laser-on-door-open, laser-fix-hk-sync, lock-state-crosstalk]
        variant: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          submodules: true

      - name: Configure git identity
        run: |
          git config user.name "fork-automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream
        if: matrix.variant == 'latest'
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main

      - name: Compute keys
        id: keys
        run: |
          echo "branch_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(( $(date -u +%s) / 86400 / 6 ))" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.variant }}" = "latest" ]; then
            echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if this exact combination was already verified
        id: sha_cache
        uses: actions/cache@v6
        with:
          path: .build-check-marker
          key: build-check-${{ env.CACHE_EPOCH }}-${{ matrix.variant }}-${{ matrix.branch }}-${{ steps.keys.outputs.branch_sha }}-${{ steps.keys.outputs.upstream_sha }}

      - name: Check if we've refreshed the artifact recently
        id: time_cache
        uses: actions/cache@v6
        with:
          path: .build-check-marker
          key: build-check-freshness-${{ env.CACHE_EPOCH }}-${{ matrix.variant }}-${{ matrix.branch }}-${{ steps.keys.outputs.bucket }}

      - name: Scratch-merge upstream/main (never pushed)
        id: merge
        if: matrix.variant == 'latest' && (steps.sha_cache.outputs.cache-hit != 'true' || steps.time_cache.outputs.cache-hit != 'true')
        run: |
          if git merge --no-commit --no-ff upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute source tree hash
        id: treehash
        # Captures the exact file content about to be built - independent of whether
        # it's ever committed. The scratch-merge above uses --no-commit, so HEAD never
        # moves even when latest genuinely pulls in new upstream content; a commit SHA
        # would misleadingly show pinned/latest as "the same" every time. write-tree
        # hashes the actual staged content instead, so it only matches when the two
        # variants are truly compiling identical source.
        run: echo "hash=$(git write-tree | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: steps.sha_cache.outputs.cache-hit != 'true' || steps.time_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        if: steps.sha_cache.outputs.cache-hit != 'true' || steps.time_cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"

      - name: Fetch branch-tags mapping from main-fork
        run: git fetch origin main-fork --depth 1

      - name: Compute version tag
        id: vertag
        run: |
          SHORT=$(git show origin/main-fork:.github/branch-tags.json | jq -r --arg b "${{ matrix.branch }}" '.[$b] // $b')
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHORT}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

      - name: Install PlatformIO Core
        if: steps.sha_cache.outputs.cache-hit != 'true' || steps.time_cache.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build PlatformIO project
        id: build
        if: |
          (steps.sha_cache.outputs.cache-hit != 'true' || steps.time_cache.outputs.cache-hit != 'true') &&
          (matrix.variant == 'pinned' || steps.merge.outputs.conflict == 'false')
        run: |
          if PLATFORMIO_BUILD_DIR=.pio/build-check PLATFORMIO_BUILD_FLAGS='-D VERSION_TAG=${{ steps.vertag.outputs.tag }}' pio run -e ratgdo_esp32dev; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload firmware artifact
        if: steps.build.outputs.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.branch }}-${{ matrix.variant }}-${{ steps.treehash.outputs.hash }}-firmware
          retention-days: 7
          path: |
            .pio/build-check/ratgdo_esp32dev/firmware.bin
            .pio/build-check/ratgdo_esp32dev/firmware.elf

      - name: Publish rolling pre-release
        # Only the pinned variant gets published - it's the one that's an actual,
        # inspectable git ref (the branch tip), unlike "latest" which is a scratch
        # merge that's never committed anywhere. Re-publishing under the same tag
        # each time (rather than accumulating one release per run) keeps this a
        # single stable download URL per branch, and avoids the short artifact
        # expiry for anyone testing builds from outside this fork.
        if: matrix.variant == 'pinned' && steps.build.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.vertag.outputs.short }}"
          SHA="${{ steps.keys.outputs.branch_sha }}"
          # Matches exactly what the device itself reports as "Firmware version:"
          # (see auto_firmware_version.py) - manifest.json's version, minus the
          # leading v, plus the VERSION_TAG build flag - so it's a direct copy-paste
          # comparison against what's actually flashed.
          BUILD_VERSION=$(jq -r '.version' docs/manifest.json | sed 's/^v//')
          FULL_VERSION="${BUILD_VERSION}-${{ steps.vertag.outputs.tag }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$SHA" \
            --title "${{ matrix.branch }} — v${FULL_VERSION}" \
            --notes "Firmware version: \`$FULL_VERSION\` - matches exactly what the device's status page/logs report after flashing, so you can confirm what's running. Automated test build from branch \`${{ matrix.branch }}\` @ \`$SHA\`. Unofficial fork build, not affiliated with the upstream ratgdo project - see FORK-NOTES.md for what this branch changes. Rebuilt and replaced automatically as the branch moves; this is not a stable release." \
            .pio/build-check/ratgdo_esp32dev/firmware.bin \
            .pio/build-check/ratgdo_esp32dev/firmware.elf

      - name: Mark verified
        # Only created on genuine success, so a conflicting or failed run never
        # populates the cache - the next run with the same branch/upstream SHAs
        # gets a real cache miss and re-attempts (and re-fails) instead of
        # silently skipping an unresolved problem.
        if: steps.build.outputs.result == 'success'
        run: touch .build-check-marker

      - name: Job summary
        if: always()
        run: |
          BRANCH="${{ matrix.branch }}"
          VARIANT="${{ matrix.variant }}"
          {
            if [ "${{ steps.sha_cache.outputs.cache-hit }}" = "true" ] && [ "${{ steps.time_cache.outputs.cache-hit }}" = "true" ]; then
              echo "### SKIPPED: \`$BRANCH\` ($VARIANT)"
              echo "No changes since the last verified build, and still within the 6-day artifact refresh window. Nothing rebuilt."
            elif [ "$VARIANT" = "latest" ] && [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
              echo "### WARNING: \`$BRANCH\` ($VARIANT) merge conflict"
              echo "Scratch merge of upstream/main into \`$BRANCH\` no longer applies cleanly. Manual rebase needed."
              exit 1
            elif [ "${{ steps.build.outputs.result }}" = "failure" ]; then
              echo "### FAILED: \`$BRANCH\` ($VARIANT) build failed"
              echo "\`pio run -e ratgdo_esp32dev\` failed."
              exit 1
            else
              echo "### OK: \`$BRANCH\` ($VARIANT)"
              if [ "$VARIANT" = "pinned" ]; then
                echo "Builds successfully as-is (no upstream merge, exactly what's pushed to the branch). Firmware artifact uploaded (7-day retention) and published to the [${{ steps.vertag.outputs.short }} release](https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.vertag.outputs.short }})."
              else
                echo "Merges cleanly with upstream/main and builds successfully. Firmware artifact uploaded (7-day retention)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
