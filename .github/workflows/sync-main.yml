name: Sync main and main-fork

on:
  schedule:
    - cron: "9 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: https://github.com/ratgdo/homekit-ratgdo32.git

jobs:
  sync:
    if: github.repository == 'bmusat/homekit-ratgdo32'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "fork-automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main --tags

      - name: Determine latest upstream release tag
        # Track the latest tagged release, not upstream/main's branch tip. The
        # maintainer treats the tip as a mutable staging area while a release is
        # still in progress - repeatedly amending its "Update CHANGELOG.md and
        # version number" commit as more fixes land, which broke our fast-forward
        # three times in six weeks (v3.5.1, v3.5.2, v3.5.3). A tag, once pushed,
        # doesn't move - v3.5.1 and v3.5.2 both remained clean ancestors of
        # upstream/main throughout, unlike the untagged commits past them.
        id: latest_tag
        run: echo "tag=$(git tag -l 'v*' --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Fast-forward (or reset) main to latest release tag
        id: ff
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if git merge --ff-only "$TAG"; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "reset=false" >> "$GITHUB_OUTPUT"
            echo "note=main was already up to date or fast-forwarded cleanly to $TAG" >> "$GITHUB_OUTPUT"
          else
            # A plain fast-forward failing here means upstream amended a commit
            # main already had (their release-prep commit gets rewritten while
            # a release is in progress, even after tagging in one observed case
            # on 2026-09-08). main is documented to carry zero unique content,
            # and $TAG is an immutable, deliberately-published release, so a
            # hard reset onto it is always safe - no manual investigation
            # needed for this specific, now-recurring case.
            git reset --hard "$TAG"
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "reset=true" >> "$GITHUB_OUTPUT"
            echo "note=main could not fast-forward to $TAG (upstream rewrote a commit again) - hard reset instead" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main and tags
        if: steps.ff.outputs.status == 'ok'
        run: |
          git push --force-with-lease origin main
          git push origin --tags

      - name: Merge main into main-fork
        id: merge_fork
        if: steps.ff.outputs.status == 'ok'
        run: |
          git fetch origin main-fork
          git checkout -B main-fork origin/main-fork
          if git merge main --no-edit; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Push main-fork
        if: steps.merge_fork.outputs.status == 'ok'
        run: git push origin main-fork

      - name: Trigger build-check
        if: steps.merge_fork.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-check.yml --repo ${{ github.repository }} --ref main-fork

      - name: Job summary
        if: always()
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          RESET="${{ steps.ff.outputs.reset }}"
          if [ "${{ steps.merge_fork.outputs.status }}" = "conflict" ]; then
            {
              echo "### WARNING: main-fork merge conflict"
              echo "main is at \`$TAG\`, but merging main into main-fork produced a conflict. Needs manual resolution."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              if [ "$RESET" = "true" ]; then
                echo "### :warning: OK, but main was auto-recovered"
                echo ""
                echo "**Upstream rewrote a commit \`main\` was already based on, so a plain fast-forward to \`$TAG\` failed. \`main\` was hard-reset onto \`$TAG\` to recover automatically.** This is expected, handled behavior - no action needed unless it starts happening on every single run."
                echo ""
              else
                echo "### OK"
              fi
              echo "main is at \`$TAG\` (tags included), and main-fork merged cleanly."
              echo "Triggered [build-check.yml](https://github.com/$GITHUB_REPOSITORY/actions/workflows/build-check.yml) on \`main-fork\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
