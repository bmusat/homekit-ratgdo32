name: Sync main and main-fork

on:
  schedule:
    - cron: "9 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: https://github.com/ratgdo/homekit-ratgdo32.git

jobs:
  sync:
    if: github.repository == 'bmusat/homekit-ratgdo32'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "fork-automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main --tags

      - name: Determine latest upstream release tag
        # Track the latest tagged release, not upstream/main's branch tip. The
        # maintainer treats the tip as a mutable staging area while a release is
        # still in progress - repeatedly amending its "Update CHANGELOG.md and
        # version number" commit as more fixes land, which broke our fast-forward
        # three times in six weeks (v3.5.1, v3.5.2, v3.5.3). A tag, once pushed,
        # doesn't move - v3.5.1 and v3.5.2 both remained clean ancestors of
        # upstream/main throughout, unlike the untagged commits past them.
        id: latest_tag
        run: echo "tag=$(git tag -l 'v*' --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main to latest release tag
        id: ff
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if git merge --ff-only "$TAG"; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "note=main was already up to date or fast-forwarded cleanly to $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "status=diverged" >> "$GITHUB_OUTPUT"
            echo "note=main is not a clean ancestor of $TAG - manual investigation needed" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main and tags
        if: steps.ff.outputs.status == 'ok'
        run: |
          git push origin main
          git push origin --tags

      - name: Merge main into main-fork
        id: merge_fork
        if: steps.ff.outputs.status == 'ok'
        run: |
          git fetch origin main-fork
          git checkout -B main-fork origin/main-fork
          if git merge main --no-edit; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Push main-fork
        if: steps.merge_fork.outputs.status == 'ok'
        run: git push origin main-fork

      - name: Trigger build-check
        if: steps.merge_fork.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-check.yml --repo ${{ github.repository }} --ref main-fork

      - name: Job summary
        if: always()
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if [ "${{ steps.ff.outputs.status }}" != "ok" ]; then
            {
              echo "### WARNING: main did not fast-forward"
              echo "main is not a clean ancestor of the latest release tag (\`$TAG\`) - unexpected, since tags shouldn't move. Needs manual investigation."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "${{ steps.merge_fork.outputs.status }}" = "conflict" ]; then
            {
              echo "### WARNING: main-fork merge conflict"
              echo "main fast-forwarded cleanly, but merging main into main-fork produced a conflict. Needs manual resolution."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "### OK"
              echo "main fast-forwarded to \`$TAG\` (tags included), and main-fork merged cleanly."
              echo "Triggered [build-check.yml](https://github.com/$GITHUB_REPOSITORY/actions/workflows/build-check.yml) on \`main-fork\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
